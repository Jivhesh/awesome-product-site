<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — ProductName</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .contact-hero { padding: 10rem 0 2rem; text-align: center; }
    .contact-hero h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin-bottom: var(--space-sm); }
    .contact-hero p { color: var(--clr-text-muted); max-width: 500px; margin: 0 auto; font-size: 1.1rem; }

    .contact-form-section { padding: var(--space-xl) 0 var(--space-2xl); }
    .contact-form {
      max-width: 560px;
      margin: 0 auto;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
    }
    .form-group { margin-bottom: var(--space-md); }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--clr-text-muted);
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--clr-border);
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: var(--ff-body);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--clr-primary);
    }
    .form-group textarea { resize: vertical; min-height: 140px; }
    .contact-form .btn { width: 100%; margin-top: var(--space-sm); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="../index.html" class="navbar__logo"><span class="logo-icon">◆</span> ProductName</a>
      <ul class="navbar__links">
        <li><a href="../index.html#features">Features</a></li>
        <li><a href="../index.html#testimonials">Testimonials</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section class="contact-hero">
    <div class="container">
      <h1>Get in <span class="gradient-text">Touch</span></h1>
      <p>Have a question or want to work with us? Drop us a message!</p>
    </div>
  </section>

  <section class="contact-form-section">
    <div class="container">
      <form class="contact-form" id="contact-form">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="john@example.com" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Tell us what's on your mind..." required></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--lg">Send Message →</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__bottom">
      <p>&copy; 2026 ProductName. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Message sent! We\'ll get back to you soon. 🎉');
      e.target.reset();
    });
  </script>
</body>
</html>
